<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart PC Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#dfeade;--panel:#f3f8f1;--ink:#12362b;--muted:#4a6b5e;--line:#9dbbab;--copper:#a8651f;--accent:#12362b;--accent-ink:#f3f8f1;--ok:#1d6b3a;--warn:#a63a1c;--dot:#b7cfbf;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d3228;--panel:#0a2820;--ink:#e9f1e6;--muted:#8fb3a3;--line:#2a5a4a;--copper:#e0a458;--accent:#e0a458;--accent-ink:#2a1a05;--ok:#8fe0a8;--warn:#ff9b7a;--dot:#14473a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d3228;--panel:#0a2820;--ink:#e9f1e6;--muted:#8fb3a3;--line:#2a5a4a;--copper:#e0a458;--accent:#e0a458;--accent-ink:#2a1a05;--ok:#8fe0a8;--warn:#ff9b7a;--dot:#14473a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;color:var(--ink);background:var(--bg) radial-gradient(var(--dot) 1.5px,transparent 1.6px) 0 0/22px 22px;font:16px/1.5 "Chakra Petch",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
main{max-width:1000px;margin:0 auto;padding:32px 16px 56px}
h1{font-size:clamp(2rem,7vw,3.6rem);line-height:1;margin:0 0 8px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 28px;max-width:46ch}
.layout{display:grid;gap:20px;align-items:start}
@media (min-width:820px){.layout{grid-template-columns:320px 1fr}.panel.ctl{position:sticky;top:20px}}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:4px;padding:20px;position:relative}
.panel::before,.panel::after{content:"";position:absolute;width:9px;height:9px;border-radius:50%;background:var(--copper);top:8px}
.panel::before{left:8px}.panel::after{right:8px}
.panel>:first-child{margin-top:12px}
label,legend{font-weight:500;display:block;margin-bottom:6px}
input[type=number]{width:100%;font:inherit;padding:10px 12px;border:2px solid var(--line);border-radius:3px;background:var(--bg);color:var(--ink)}
fieldset{border:0;padding:0;margin:18px 0 0}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:2px solid var(--line);border-radius:3px;margin-bottom:8px;cursor:pointer;font-weight:400}
.opt:has(input:checked){border-color:var(--copper);background:var(--bg)}
.opt input{margin-top:5px;accent-color:var(--copper)}
button{font:inherit;font-weight:700;padding:11px 18px;border-radius:3px;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer;width:100%}
button.ghost{background:transparent;color:var(--ink);border-color:var(--line);width:auto}
button:focus-visible,input:focus-visible{outline:3px solid var(--copper);outline-offset:2px}
.err{color:var(--warn);margin:8px 0 10px;min-height:1.4em}
#result[hidden]{display:none}
#result{margin-top:0}
.cat{color:var(--copper);font-weight:700;font-size:1.1rem;margin:0 0 14px}
table{width:100%;border-collapse:separate;border-spacing:0 8px}
tr{background:var(--bg)}
td{padding:10px 12px;vertical-align:top}
td:first-child{color:var(--muted);width:30%;border-left:5px solid var(--copper)}
td.name{font-weight:500}
td:last-child{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:700}
.total{display:flex;justify-content:space-between;font-size:1.4rem;font-weight:700;border-top:3px double var(--line);padding-top:14px;margin-top:8px}
.status{margin:14px 0 4px;font-weight:500}
.status.ok{color:var(--ok)}.status.bad{color:var(--warn)}
.actions{margin-top:16px}
.note{color:var(--muted);font-size:.9rem;margin-top:14px}
@media (max-width:520px){tr{display:grid;grid-template-columns:1fr auto;border-left:5px solid var(--copper)}td:first-child{grid-column:1/3;border-left:0;width:auto;padding-bottom:0}td{padding-top:4px}}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.top h1{min-width:0}.lang{font:inherit;font-weight:500;padding:8px 10px;border:2px solid var(--line);border-radius:3px;background:var(--panel);color:var(--ink);cursor:pointer;flex:none}.lang:focus-visible{outline:3px solid var(--copper);outline-offset:2px}
</style>
</head>
<body>
<main>
<div class="top"><h1>Smart PC Builder</h1><select id="lang" class="lang"></select></div>
<p class="sub" data-i18n="sub"></p>
<div class="layout">
<div class="panel ctl">
  <label for="budget" data-i18n="budget"></label>
  <input id="budget" type="number" inputmode="decimal" step="any" placeholder="bijv. 1200">
  <fieldset>
    <legend data-i18n="goal"></legend>
    <label class="opt"><input type="radio" name="goal" value="1" checked><span data-i18n="g1"></span></label>
    <label class="opt"><input type="radio" name="goal" value="2"><span data-i18n="g2"></span></label>
    <label class="opt"><input type="radio" name="goal" value="3"><span data-i18n="g3"></span></label>
  </fieldset>
  <p class="err" id="err" role="alert"></p>
  <button id="go" type="button" data-i18n="go"></button>
</div>
<section id="result" class="panel" hidden aria-live="polite">
  <p class="cat" id="cat"></p>
  <table id="parts"></table>
  <div class="total"><span data-i18n="total"></span><span id="total"></span></div>
  <p class="status" id="status"></p>
  <p class="note" id="up"></p>
  <p class="note" data-i18n="compat"></p>
  <p class="note" data-i18n="note"></p>
  <div class="actions"><button id="copy" class="ghost" type="button" data-i18n="copy"></button></div>
  <p class="note" id="copied" role="status"></p>
</section>
</div>
</main>
<script>
var LOC = {nl:"nl-NL", en:"en-GB", de:"de-DE", fr:"fr-FR"};
var L = {
nl:{name:"Nederlands", sub:"Vul je budget en doel in en krijg een compatibele onderdelenlijst.", budget:"Totaal budget (€)", ph:"bijv. 1200", goal:"Hoofddoel van deze pc", g1:"Casual, allround en eSports", g2:"Performance en high-FPS gaming", g3:"Quality: 4K of zware workloads", go:"Toon advies", total:"Geschatte totaalprijs", note:"Prijzen zijn schattingen uit de catalogus van {date}, geen live prijzen.", copy:"Kopieer advies", copied:"Advies gekopieerd.", copyFail:"Kopiëren lukt niet. Selecteer de lijst hierboven en kopieer handmatig.", errNum:"Voer een geldig getal in, bijvoorbeeld 850 of 1200,50.", errMin:"Onder €450 is het lastig om een nieuwe gaming-pc samen te stellen. Probeer minstens €500.", over:"Let op: deze build valt {d} boven je budget van {b}.", left:"Je houdt nog {d} over van je budget van {b}.", parts:["Processor (CPU)","CPU-koeling","Moederbord","Werkgeheugen (RAM)","Grafische kaart (GPU)","Opslag (SSD)","Voeding","Behuizing"], stock:"Stock CPU-koeler (meegeleverd)", up:"Met {d} extra budget kun je upgraden naar: {n}.", compat:"Alle onderdelen zijn gecontroleerd op compatibiliteit: socket, geheugentype en vermogen van de voeding.", head:"PC-build advies", bud:"Budget", cat:"Categorie", tot:"Totaalprijs", lang:"Taal"},
en:{name:"English", sub:"Enter your budget and goal to get a compatible parts list.", budget:"Total budget (€)", ph:"e.g. 1200", goal:"Main purpose of this PC", g1:"Casual, all-round and eSports", g2:"Performance and high-FPS gaming", g3:"Quality: 4K or heavy workloads", go:"Show advice", total:"Estimated total price", note:"Prices are estimates from the catalog of {date}, not live prices.", copy:"Copy advice", copied:"Advice copied.", copyFail:"Copying failed. Select the list above and copy it manually.", errNum:"Enter a valid number, for example 850 or 1200.50.", errMin:"Below €450 it is hard to put together a new gaming PC. Try at least €500.", over:"Note: this build is {d} over your budget of {b}.", left:"You have {d} left from your budget of {b}.", parts:["Processor (CPU)","CPU cooler","Motherboard","Memory (RAM)","Graphics card (GPU)","Storage (SSD)","Power supply","Case"], stock:"Stock CPU cooler (included)", up:"With {d} more budget you could upgrade to: {n}.", compat:"All parts are checked for compatibility: socket, memory type and power supply wattage.", head:"PC build advice", bud:"Budget", cat:"Category", tot:"Total price", lang:"Language"},
de:{name:"Deutsch", sub:"Gib dein Budget und Ziel ein und erhalte eine kompatible Teileliste.", budget:"Gesamtbudget (€)", ph:"z. B. 1200", goal:"Hauptzweck dieses PCs", g1:"Casual, Allround und eSports", g2:"Performance und High-FPS-Gaming", g3:"Quality: 4K oder schwere Workloads", go:"Empfehlung anzeigen", total:"Geschätzter Gesamtpreis", note:"Preise sind Schätzungen aus dem Katalog vom {date}, keine Live-Preise.", copy:"Empfehlung kopieren", copied:"Empfehlung kopiert.", copyFail:"Kopieren fehlgeschlagen. Markiere die Liste oben und kopiere sie manuell.", errNum:"Gib eine gültige Zahl ein, zum Beispiel 850 oder 1200,50.", errMin:"Unter €450 ist es schwierig, einen neuen Gaming-PC zusammenzustellen. Versuche mindestens €500.", over:"Achtung: Dieser Build liegt {d} über deinem Budget von {b}.", left:"Du behältst {d} von deinem Budget von {b} übrig.", parts:["Prozessor (CPU)","CPU-Kühler","Mainboard","Arbeitsspeicher (RAM)","Grafikkarte (GPU)","Speicher (SSD)","Netzteil","Gehäuse"], stock:"Boxed-CPU-Kühler (im Lieferumfang)", up:"Mit {d} mehr Budget könntest du upgraden auf: {n}.", compat:"Alle Teile wurden auf Kompatibilität geprüft: Sockel, Speichertyp und Netzteilleistung.", head:"PC-Build-Empfehlung", bud:"Budget", cat:"Kategorie", tot:"Gesamtpreis", lang:"Sprache"},
fr:{name:"Français", sub:"Indique ton budget et ton objectif pour obtenir une liste de pièces compatibles.", budget:"Budget total (€)", ph:"p. ex. 1200", goal:"Usage principal de ce PC", g1:"Casual, polyvalent et eSports", g2:"Performance et gaming haute fréquence", g3:"Quality : 4K ou charges lourdes", go:"Afficher le conseil", total:"Prix total estimé", note:"Les prix sont des estimations du catalogue du {date}, pas des prix en direct.", copy:"Copier le conseil", copied:"Conseil copié.", copyFail:"Copie impossible. Sélectionne la liste ci-dessus et copie-la à la main.", errNum:"Saisis un nombre valide, par exemple 850 ou 1200,50.", errMin:"En dessous de 450 €, il est difficile de monter un nouveau PC gamer. Essaie au moins 500 €.", over:"Attention : cette config dépasse ton budget de {b} de {d}.", left:"Il te reste {d} sur ton budget de {b}.", parts:["Processeur (CPU)","Refroidissement CPU","Carte mère","Mémoire (RAM)","Carte graphique (GPU)","Stockage (SSD)","Alimentation","Boîtier"], stock:"Ventirad CPU d’origine (fourni)", up:"Avec {d} de budget en plus, tu pourrais passer à : {n}.", compat:"Toutes les pièces sont vérifiées pour la compatibilité : socket, type de mémoire et puissance de l’alimentation.", head:"Conseil de config PC", bud:"Budget", cat:"Catégorie", tot:"Prix total", lang:"Langue"}
};
// ===== PRICE CATALOG: edit prices here (p = price in €, s = performance score) =====
var UPDATED = "2026-10-23";
var CPUS = [
  {n:"Intel Core i3-12100F",p:90,s:40,sock:"LGA1700",w:60,box:1},
  {n:"Intel Core i5-12400F",p:125,s:55,sock:"LGA1700",w:65,box:1},
  {n:"AMD Ryzen 5 5600X",p:135,s:58,sock:"AM4",w:65,box:1},
  {n:"Intel Core i5-13400F",p:210,s:65,sock:"LGA1700",w:65,box:1},
  {n:"AMD Ryzen 5 7600X",p:215,s:72,sock:"AM5",w:105,box:0},
  {n:"AMD Ryzen 7 7800X3D",p:365,s:100,sock:"AM5",w:120,box:0}];
var GPUS = [
  {n:"AMD RX 6600 (8GB)",p:210,s:35,w:132,v:8},
  {n:"NVIDIA RTX 4060 (8GB)",p:315,s:45,w:115,v:8},
  {n:"AMD RX 6700 XT (12GB)",p:310,s:52,w:230,v:12},
  {n:"NVIDIA RTX 4060 Ti (16GB)",p:440,s:58,w:165,v:16},
  {n:"AMD RX 7700 XT (12GB)",p:460,s:68,w:245,v:12},
  {n:"NVIDIA RTX 4070 Super (12GB)",p:640,s:85,w:220,v:12},
  {n:"NVIDIA RTX 4070 Ti Super (16GB)",p:845,s:100,w:285,v:16},
  {n:"NVIDIA RTX 4080 Super (16GB)",p:1070,s:125,w:320,v:16}];
var BOARDS = [
  {n:"Gigabyte H610M S2H (LGA1700)",p:85,sock:"LGA1700",m:"D4"},
  {n:"MSI PRO B760M-P DDR4",p:105,sock:"LGA1700",m:"D4"},
  {n:"MSI B550-A PRO (AM4)",p:95,sock:"AM4",m:"D4"},
  {n:"MSI B760 GAMING PLUS WIFI",p:150,sock:"LGA1700",m:"D5"},
  {n:"ASUS TUF GAMING B650-PLUS WIFI (AM5)",p:180,sock:"AM5",m:"D5"},
  {n:"Gigabyte B650 AORUS ELITE AX",p:210,sock:"AM5",m:"D5"},
  {n:"MSI MAG X670E TOMAHAWK WIFI",p:270,sock:"AM5",m:"D5"},
  {n:"Gigabyte X670E AORUS MASTER (AM5)",p:320,sock:"AM5",m:"D5"}];
var RAMS = [
  {n:"16GB DDR4 3200MHz CL16",p:45,m:"D4",gb:16},
  {n:"32GB (2x16GB) DDR5 5600MHz",p:105,m:"D5",gb:32},
  {n:"32GB (2x16GB) DDR5 6000MHz CL30",p:115,m:"D5",gb:32},
  {n:"64GB (2x32GB) DDR5 6000MHz CL30",p:210,m:"D5",gb:64}];
var STOCK = {n:"@stock",p:0,t:0};
var COOLERS = [
  {n:"Thermalright Assassin X 120",p:22,t:1},
  {n:"Thermalright Peerless Assassin 120 SE",p:40,t:2},
  {n:"DeepCool LS720 360mm AIO",p:120,t:3},
  {n:"NZXT Kraken Elite 360 AIO",p:260,t:4}];
var PSUS = [
  {n:"500W 80+ Bronze PSU",p:55,w:500},{n:"600W 80+ Bronze PSU",p:65,w:600},
  {n:"650W 80+ Bronze PSU",p:70,w:650},{n:"650W 80+ Gold, modular",p:90,w:650},
  {n:"700W 80+ Gold PSU",p:95,w:700},{n:"750W 80+ Gold, modular",p:110,w:750},
  {n:"850W 80+ Gold ATX 3.0",p:140,w:850},{n:"1000W 80+ Platinum ATX 3.0",p:180,w:1000}];
var CASES = [
  {n:"Mini tower",p:45},{n:"Compact mid tower",p:55},{n:"Mid tower, airflow",p:60},
  {n:"Gaming tower, high airflow",p:85},{n:"NZXT H5 Flow",p:95},
  {n:"Corsair 4000D Airflow RGB",p:110},{n:"Lian Li O11 Dynamic EVO",p:160}];
var SSDS = [{n:"1TB NVMe M.2 SSD (Gen4)",p:65},{n:"2TB NVMe M.2 SSD (Gen4)",p:120}];

// ===== PICKER: best performance within budget, with compatibility checks =====
function cheapest(list, ok) {
  return list.filter(ok || function () { return true; }).sort(function (a, b) { return a.p - b.p; })[0];
}
function build(b, g) {
  var w = g === "2" ? [0.35, 0.65] : g === "3" ? [0.25, 0.75] : [0.5, 0.5], c = [];
  CPUS.forEach(function (cpu) { GPUS.forEach(function (gpu) { RAMS.forEach(function (ram) {
    if (g === "3" && (gpu.v < 12 || ram.gb < 32)) return;
    var mb = cheapest(BOARDS, function (x) { return x.sock === cpu.sock && x.m === ram.m; });
    if (!mb) return;
    var cool = cpu.box ? STOCK : COOLERS[0];
    var psu = cheapest(PSUS, function (x) { return x.w >= (cpu.w + gpu.w) * 1.6; });
    if (!psu) return;
    var it = [cpu, cool, mb, ram, gpu, SSDS[0], psu, CASES[0]];
    c.push({it: it, cost: it.reduce(function (s, x) { return s + x.p; }, 0), score: w[0] * cpu.s + w[1] * gpu.s - 0.8 * Math.max(0, gpu.s * 0.8 - cpu.s)});
  }); }); });
  var fit = c.filter(function (x) { return x.cost <= b; });
  if (!fit.length) return c.sort(function (x, y) { return x.cost - y.cost; })[0];
  return fit.sort(function (x, y) { return y.score - x.score || x.cost - y.cost; })[0];
}
function pick(b, g) {
  var base = build(b, g), it = base.it.slice(), left = b - base.cost, cpu = it[0], mb0 = it[2];
  function up(i, list, ok) {
    var cur = it[i], o = list.filter(function (x) { return (!ok || ok(x)) && x.p >= cur.p && x.p - cur.p <= left; }).sort(function (x, y) { return y.p - x.p; })[0];
    if (o && o.p > cur.p) { left -= o.p - cur.p; it[i] = o; }
  }
  if (left > 0) {
    up(3, RAMS, function (x) { return x.m === mb0.m && x.gb >= it[3].gb; });
    up(5, SSDS); up(1, COOLERS); up(2, BOARDS, function (x) { return x.sock === cpu.sock && x.m === mb0.m; }); up(7, CASES);
  }
  var grp = b < 700 ? "Budget: €500 – €700" : b < 1000 ? "Budget: €700 – €1000" : b < 1400 ? "Budget: €1000 – €1400" : b < 1800 ? "Budget: €1400 – €1800" : b < 2300 ? "Budget: €1800 – €2300" : "Budget: €2300+ (high-end)";
  var upg = null;
  for (var d = 25; d <= 500 && !upg; d += 25) {
    var n = build(b + d, g);
    var ch = [0, 4].filter(function (i) { return n.it[i].s > base.it[i].s; }).map(function (i) { return n.it[i].n; });
    if (n.score > base.score && ch.length) upg = {d: d, n: ch.join(" + ")};
  }
  return {grp: grp, items: it, up: upg};
}
function dateStr() { return new Date(UPDATED).toLocaleDateString(LOC[lang], {day: "numeric", month: "long", year: "numeric"}); }

var lang = "nl", state = null, text = "";
try { var sv = localStorage.getItem("pcb-lang"); if (sv && L[sv]) lang = sv; else { var nv = (navigator.language || "nl").slice(0, 2); if (L[nv]) lang = nv; } } catch (e) {}
var $ = function (id) { return document.getElementById(id); };
var eur = function (x) { return "€" + x.toLocaleString(LOC[lang], {minimumFractionDigits: 2, maximumFractionDigits: 2}); };

function applyLang() {
  var t = L[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(function (el) { el.textContent = t[el.getAttribute("data-i18n")].replace("{date}", dateStr()); });
  $("budget").placeholder = t.ph;
  $("lang").setAttribute("aria-label", t.lang);
  $("lang").value = lang;
  $("err").textContent = "";
  $("copied").textContent = "";
  if (state) render();
}
function render() {
  var t = L[lang], b = state.b, r = pick(b, state.g);
  var rows = r.items.map(function (x, i) { return [t.parts[i], x.n === "@stock" ? t.stock : x.n, x.p]; });
  var total = rows.reduce(function (s, x) { return s + x[2]; }, 0);
  $("cat").textContent = r.grp;
  var tb = $("parts"); tb.textContent = "";
  rows.forEach(function (x) {
    var tr = document.createElement("tr");
    [x[0], x[1], eur(x[2])].forEach(function (c, i) { var td = document.createElement("td"); td.textContent = c; if (i === 1) td.className = "name"; tr.appendChild(td); });
    tb.appendChild(tr);
  });
  $("total").textContent = eur(total);
  var st = $("status"), msg;
  if (total > b) { msg = t.over.replace("{d}", eur(total - b)).replace("{b}", eur(b)); st.className = "status bad"; }
  else { msg = t.left.replace("{d}", eur(b - total)).replace("{b}", eur(b)); st.className = "status ok"; }
  st.textContent = msg;
  $("up").textContent = r.up ? t.up.replace("{d}", eur(r.up.d)).replace("{n}", r.up.n) : "";
  text = t.head + "\n" + t.bud + ": " + eur(b) + "\n" + t.cat + ": " + r.grp + "\n\n" + rows.map(function (x) { return x[0] + ": " + x[1] + " (" + eur(x[2]) + ")"; }).join("\n") + "\n\n" + t.tot + ": " + eur(total) + "\n" + msg;
  $("result").hidden = false;
}
$("go").addEventListener("click", function () {
  var t = L[lang], b = parseFloat($("budget").value.replace(",", "."));
  $("err").textContent = "";
  if (isNaN(b)) { $("err").textContent = t.errNum; $("result").hidden = true; state = null; return; }
  if (b < 450) { $("err").textContent = t.errMin; $("result").hidden = true; state = null; return; }
  state = {b: b, g: document.querySelector("input[name=goal]:checked").value};
  $("copied").textContent = "";
  render();
  $("result").scrollIntoView({behavior: "smooth", block: "start"});
});
$("copy").addEventListener("click", function () {
  var t = L[lang], out = $("copied");
  try { navigator.clipboard.writeText(text).then(function () { out.textContent = t.copied; }, function () { out.textContent = t.copyFail; }); }
  catch (e) { out.textContent = t.copyFail; }
});
var sel = $("lang");
Object.keys(L).forEach(function (k) { var o = document.createElement("option"); o.value = k; o.textContent = L[k].name; sel.appendChild(o); });
sel.addEventListener("change", function () { lang = sel.value; try { localStorage.setItem("pcb-lang", lang); } catch (e) {} applyLang(); });
applyLang();
</script>
</body>
</html>
